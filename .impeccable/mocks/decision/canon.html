<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f4f6fb;font:400 15px/1.4 Mukta,sans-serif;color:#111827;position:relative}
.top{background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 0 #e5e7eb}
.logo{font:700 20px Mukta;color:#2563eb}.pill{border:1px solid #d1d5db;border-radius:8px;padding:5px 10px;font-size:13px}
.hero{margin:14px 16px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgb(0 0 0/10%);text-align:center}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto;background:conic-gradient(#e0592a 0 62%,#e5e7eb 0);display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 40px/1 Mukta}
.ring small{display:block;font:500 13px Mukta;color:#6b7280}
.tag{display:inline-block;background:#fde8e0;color:#a63a14;border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px}
.cards{margin:0 16px;display:grid;gap:10px}
.c{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgb(0 0 0/10%)}
.c b{display:block;font-weight:600}.c span{color:#6b7280;font-size:13px}
.c i{float:right;font-style:normal;color:#2563eb;font-weight:600;font-size:13px}
nav{position:absolute;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font:600 12px Mukta;padding-top:12px;color:#6b7280}
nav .on{color:#2563eb}
</style></head><body>
<div class="top"><div class="logo">Saans</div><div class="pill">हिन्दी</div></div>
<div class="hero"><span class="tag">Very poor</span><div class="ring"><div><span>346<small>AQI · Anand Vihar</small></span></div></div><span style="font-size:13px;color:#6b7280">PM2.5 180 µg/m³ · updated 9:30</span></div>
<div class="cards">
<div class="c"><i>−59%</i><b>Run a HEPA purifier</b><span>Biggest indoor change for Dadaji and Aarav</span></div>
<div class="c"><i>−22%</i><b>Wear a fitted N95</b><span>On your two-wheeler commute</span></div>
<div class="c"><i>−19%</i><b>Exercise at 14:00</b><span>The cleanest hour today</span></div>
<div class="c"><i>12.9 kg</i><b>Go by metro</b><span>Less CO₂ each month</span></div>
</div>
<nav><div class="on">Home</div><div>Forecast</div><div>Ask</div><div>Profile</div></nav>
</body></html>
